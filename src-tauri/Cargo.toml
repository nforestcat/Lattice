[package]
name = "lattice"
version = "0.1.0"
description = "Local-first wiki for LLM-maintained knowledge"
authors = ["nforestcat"]
edition = "2021"

[lib]
name = "lattice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lattice"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
walkdir = "2"
reqwest = { version = "0.12", features = ["json"] }
keyring = "2.1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
