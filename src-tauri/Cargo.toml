[package]
name = "local-vault-notes"
version = "0.1.0"
description = "Local-first Markdown vault desktop app"
authors = ["Local Vault Notes"]
edition = "2021"

[lib]
name = "local_vault_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "local-vault-notes"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
walkdir = "2"
